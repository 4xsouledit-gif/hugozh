<!DOCTYPE html>
<html lang="{{ site.Params.htmlLang | default "zh-CN" }}">
{{ partial "head.html" . }}
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  {{ partial "header.html" . }}
  <div class="layout">
    {{ partial "sidebar.html" . }}
    <main id="main" class="content">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "toc.html" . }}
  </div>
  {{ partial "footer.html" . }}
  {{ partial "scripts.html" . }}
</body>
</html>
