<header class="site-header">
  <div class="site-header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      <span class="brand-mark">Hugo</span>
      <span class="brand-text">中文文档 · 社区翻译</span>
    </a>
    <nav class="site-nav" aria-label="站点导航">
      {{- range site.Menus.main }}
      {{- $href := .URL }}
      {{- with .Page }}{{ $href = .RelPermalink }}{{ end }}
      {{- $external := strings.HasPrefix $href "http" }}
      <a href="{{ if $external }}{{ $href }}{{ else }}{{ $href | relURL }}{{ end }}"{{ if $external }} target="_blank" rel="noopener"{{ end }}>{{ .Name }}</a>
      {{- end }}
    </nav>
  </div>
</header>
